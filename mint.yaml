version: 1
name: Infinite Campus
slug: infinitecampus
summary: >-
  Infinite Campus (Campus Parent) MCP — single-account with CUPS
  auto-discovery. Two auth paths: IC_USERNAME/IC_PASSWORD, or sign in via
  the fetchproxy browser extension.
#
# Hosting note (a comment, not user-facing summary text): this is a
# BROWSER-BRIDGE MCP — it reaches its site through the user's signed-in
# tab via the fetchproxy bridge. A bridged registration also needs runtime
# `fly-shared`, `bridge: true` and a `bridgePortEnv`, which are registration
# fields this manifest has no schema for (set them over the control API).
# `state.dataDir` below is required for `bridge`.
env:
  - name: IC_BASE_URL
    required: true
    help: >-
      Campus Parent portal base URL, e.g. https://campus.district.k12.example.us
  - name: IC_DISTRICT
    required: true
    help: >-
      Infinite Campus district app name (appName path segment from the portal
      URL)
  - name: IC_USERNAME
    required: false
    help: >-
      Campus Parent portal username. Optional: leave unset to use the fetchproxy
      browser-extension fallback.
  - name: IC_PASSWORD
    secret: true
    required: false
    help: >-
      Campus Parent portal password. Required only when IC_USERNAME is set.
  - name: IC_NAME
    required: false
    help: >-
      Friendly name for the district (defaults to district appname)
  - name: IC_DISABLE_FETCHPROXY
    required: false
    help: >-
      Set to 1 to skip the fetchproxy browser-extension fallback (missing creds
      become a hard error — useful in headless CI).
  - name: IC_SESSION_CACHE
    required: false
    help: >-
      Set to false to disable the on-disk session cache and authenticate on
      every process start. Defaults to enabled.
  - name: IC_SESSION_FILE
    required: false
    help: >-
      Absolute path for the session cache file. Defaults to
      $MCP_DATA_DIR/.infinitecampus-mcp/session-<district>.json.
state:
  dataDir: true
  reason: >-
    Two things live here. The fetchproxy identity is at
    $HOME/.fetchproxy/identity/<name>.json and the pair code derives from it —
    without a persistent $HOME every cold start mints a fresh identity and
    re-prompts pairing in the browser, and the API refuses bridge without it.
    The primary district's session is also cached at
    $MCP_DATA_DIR/.infinitecampus-mcp/session-<district>.json (0600) when
    credentials are configured, so a restart reuses it instead of logging in
    again. Fetchproxy sessions are deliberately NOT cached: they carry no
    identity to bind a record to, so a restored one could belong to a different
    IC account at the same instance.
egress:
  allow:
    # Only hosts the SERVER process actually fetches. Hosts that appear
    # solely in a URL this server BUILDS and returns are excluded.
    #
    # Every IC call is a plain Node `fetch()` from this process against the
    # host in IC_BASE_URL (login POST, every API read, document downloads).
    # The fetchproxy bridge is bootstrap-only: it lifts the signed-in tab's
    # cookies over the host's loopback bridge port and is not in the request
    # path, so it dials nothing outbound. The IC host is PER DEPLOYMENT, so
    # the two entries below cover the populations we know and are
    # wildcards on purpose — the tenant is the leading label:
    - '*.infinitecampus.org'   # Infinite Campus-hosted districts (<district>.infinitecampus.org)
    - '*.ncsis.gov'            # North Carolina's statewide instance (<LEA>.ncsis.gov)
    #
    # If your IC_BASE_URL host is neither (a self-hosted district, e.g.
    # campus.district.k12.example.us), replace these with that host.
    # Matching is exact per label: no apex is dialled, and a district host
    # answers directly (no www redirect observed).
    #
    # NOTE — this server also reaches hosts determined at RUNTIME, which
    # cannot appear as literals here:
    #   - each CUPS-linked district's own host, taken from the
    #     `districtLoginUrl` the primary district's API returns (the CUPS
    #     verify.jsp POST and every call to that district go straight there)
    #   - fully-qualified document URLs the API returns (report cards from
    #     ic_list_documents are downloaded from wherever they point)
    # Confirm the concrete host(s) against a live run and add them, or the
    # fence will block those calls while the primary district keeps working.
